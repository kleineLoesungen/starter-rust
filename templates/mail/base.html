{#
  Grundgeruest fuer HTML-Mails.

  Mails sind nicht das Web: Mailprogramme laden kein Stylesheet, viele ignorieren
  <style>-Bloecke, und Tailwind-Klassen bedeuten dort gar nichts. Deshalb hier
  ausschliesslich Inline-Styles und eine schlichte Tabelle als Rahmen — das ist
  unschoen, aber die einzige Form, die in Outlook, Gmail und Apple Mail gleich
  aussieht.
#}
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block subject %}{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f8;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2430;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f5f8;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
               style="max-width:560px;background:#ffffff;border-radius:12px;border:1px solid #e3e6ee;">
          <tr>
            <td style="padding:24px 32px;border-bottom:1px solid #e3e6ee;">
              <span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:{{ brand.theme_color }};vertical-align:middle;"></span>
              <strong style="margin-left:8px;font-size:15px;vertical-align:middle;">{{ brand.name }}</strong>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 32px;font-size:15px;line-height:1.6;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px;border-top:1px solid #e3e6ee;font-size:12px;color:#7a8194;">
              Diese Nachricht wurde automatisch von {{ brand.name }} verschickt.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
